name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            bridge/claude/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check.ps1 -InstallDependencies
      - name: Check on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: sh scripts/check.sh --install
